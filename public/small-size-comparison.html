<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巧虎图纸 · 尺寸对比</title><link rel="stylesheet" href="workbench.css"><style>main{max-width:1440px}.sizeCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.sizeCard{padding:20px;background:white;border:1px solid #deded6;border-radius:12px}.sizeCard canvas{display:block;width:100%;height:auto;image-rendering:pixelated;margin:16px 0}.sizeCard h2{margin:0 0 6px}.badge{font-size:13px;color:#48624e;font-weight:600}.compareLead{margin-bottom:24px}.sizeCard .actions{margin-top:16px}@media(max-width:850px){.sizeCards{grid-template-columns:1fr}.sizeCard canvas{max-width:520px;margin:16px auto}}</style><main><a class="back" href="index.html#home">← 返回图纸列表</a><h1>巧虎与四叶草 · 33 / 34 / 38 格</h1><p class="compareLead">同一张干净底图，三种细节密度。均使用 10 种颜色，可打开图纸继续编辑或导出。</p><div class="sizeCards" id="cards"></div></main><script>const ids=["pattern-25f38c60-666c-4ba7-adb6-8cd2fafdd6db", "pattern-4d7f5412-fb8e-4555-b7ba-733683ca0aa4", "pattern-360d881b-fa70-4908-8f14-31b921b6580d"];fetch('patterns/library.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{const cards=document.querySelector('#cards');for(const id of ids){const item=data.items.find(i=>i.id===id);if(!item)continue;const total=item.grid.flat().filter(Boolean).length,card=document.createElement('article');card.className='sizeCard';const h=document.createElement('h2');h.textContent=item.size+' × '+item.size+' 格';card.append(h);const note=document.createElement('p');note.textContent=total+' 颗豆子 · 10 种颜色';card.append(note);const tag=document.createElement('span');tag.className='badge';tag.textContent=item.size===33?'581 颗':item.size===34?'614 颗':'787 颗';card.append(tag);const cv=document.createElement('canvas');cv.setAttribute('role','img');cv.setAttribute('aria-label',item.size+'格巧虎图案预览');cv.width=cv.height=item.size*12;const ctx=cv.getContext('2d'),map=Object.fromEntries(item.palette.map(c=>[c.code,c.hex]));for(let y=0;y<item.size;y++)for(let x=0;x<item.size;x++){ctx.fillStyle=map[item.grid[y][x]]||((x+y)%2?'#fff':'#f0f1f2');ctx.fillRect(x*12,y*12,12,12)}card.append(cv);const actions=document.createElement('div');actions.className='actions';for(const [route,label] of [['preview','查看与导出'],['editor','编辑图纸']]){const a=document.createElement('a');a.className='button'+(route==='preview'?' primary':'');a.href='index.html#'+route+'?id='+encodeURIComponent(id);a.textContent=label;actions.append(a)}card.append(actions);cards.append(card)}}).catch(()=>{document.querySelector('#cards').textContent='暂时无法读取图纸，请刷新重试。'});</script></html>
