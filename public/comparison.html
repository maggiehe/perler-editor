function ink(hex){const a=hex.match(/[a-f0-9]{2}/gi).map(v=>{const n=parseInt(v,16)/255;return n<=.04045?n/12.92:((n+.055)/1.055)**2.4});return a[0]*.2126+a[1]*.7152+a[2]*.0722>.179?'#111':'#fff'}
function draw(canvas,v,labels,cell){canvas.width=canvas.height=v.size*cell;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<v.size;y++)for(let x=0;x<v.size;x++){const c=byCode[v.grid[y][x]];ctx.fillStyle=c?c.hex:'#fff';ctx.fillRect(x*cell,y*cell,cell,cell);ctx.strokeStyle='#c9c9c9';ctx.lineWidth=1;ctx.strokeRect(x*cell+.5,y*cell+.5,cell,cell);if(c&&labels){ctx.fillStyle=ink(c.hex);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='600 '+Math.floor(cell*.28)+'px Arial';ctx.fillText(c.code,(x+.5)*cell,(y+.5)*cell)}}}
VARIANTS.forEach((v,index)=>{const counts={};v.grid.flat().filter(Boolean).forEach(code=>counts[code]=(counts[code]||0)+1);const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);const total=Object.values(counts).reduce((a,b)=>a+b,0);const section=document.createElement('section');section.className='card';section.innerHTML='<div class="head"><div class="badge">版本 '+(index?'B':'A')+'</div><h2>'+v.name+'</h2><div class="metrics"><div class="metric"><b>'+total+'</b><span>颗豆子</span></div><div class="metric"><b>'+entries.length+'</b><span>种颜色</span></div><div class="metric"><b>−'+Math.round((1-total/1247)*100)+'%</b><span>相较原图</span></div></div><p class="meta">图案网格 '+v.size+' × '+v.size+' · 可放入 '+v.plate+' × '+v.plate+' 拼豆板</p></div><div class="toolbar"><label><input type="checkbox" checked class="codes">色号</label><label>放大 <input class="scale" type="range" min="1" max="4" step=".5" value="1"><output>1×</output></label><button class="download">导出 PNG</button></div><div class="viewport"><div class="canvasWrap"><canvas role="img" aria-label="'+v.name+'：巧虎与四叶草拼豆图"></canvas></div></div><div class="details"><h3>用豆清单</h3><p class="note">'+(index?'实际用豆比 A 版减少约 49%。更小巧，脸部和四叶草的细节需要重点检查。':'保留较多轮廓格点。与原图相比，实际用豆减少约 61%。')+'</p><table><thead><tr><th>色号</th><th>颜色</th><th>数量（颗）</th></tr></thead><tbody>'+entries.map(([code,n])=>'<tr><td><span class="dot" style="background:'+byCode[code].hex+'"></span><b>'+code+'</b></td><td>'+byCode[code].name+'</td><td>'+n+'</td></tr>').join('')+'</tbody><tfoot><tr><th colspan="2">合计</th><th>'+total+' 颗</th></tr></tfoot></table></div>';document.querySelector('#compare').appendChild(section);const canvas=section.querySelector('canvas'),codes=section.querySelector('.codes'),scale=section.querySelector('.scale');function render(){draw(canvas,v,codes.checked,40);const side=v.size*10*Number(scale.value);canvas.style.width=canvas.style.height=side+'px';section.querySelector('output').textContent=scale.value+'×'}codes.onchange=scale.oninput=render;render();section.querySelector('.download').onclick=()=>{const out=document.createElement('canvas');draw(out,v,codes.checked,40);const gridImage=out.toDataURL();const image=new Image();image.onload=()=>{const width=Math.max(v.size*40,720),gridSize=v.size*40;out.width=width;out.height=gridSize+190+entries.length*36;const c=out.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,out.width,out.height);c.fillStyle='#292824';c.font='bold 28px sans-serif';c.fillText('巧虎与四叶草 · '+v.name,24,40);c.font='18px sans-serif';c.fillText(total+' 颗 · '+entries.length+' 色 · MARD 221 标准色',24,74);c.drawImage(image,(width-gridSize)/2,100);c.font='bold 22px sans-serif';c.fillText('用豆清单',24,gridSize+140);entries.forEach(([code,n],i)=>{const y=gridSize+172+i*36;c.fillStyle=byCode[code].hex;c.fillRect(24,y-16,18,18);c.strokeStyle='#999';c.strokeRect(24,y-16,18,18);c.fillStyle='#292824';c.font='18px sans-serif';c.fillText(code+'  '+byCode[code].name,54,y);c.fillText(n+' 颗',width-105,y)});const a=document.createElement('a');a.download='巧虎与四叶草-'+total+'颗.png';a.href=out.toDataURL('image/png');a.click()};image.src=gridImage};});
</script><script>
const sheet=VARIANTS[0],card=document.querySelector('.card'),canvas=card.querySelector('canvas');
const panel=document.createElement('section');panel.className='annotations';panel.innerHTML='<h3>标记与修改意见</h3><p class="selection" aria-live="polite">先点击上方图纸，选择一个格子。</p><label for="annotationText">修改说明</label><textarea id="annotationText" placeholder="例如：这里的轮廓往左移一格，或这几颗换成黄色。"></textarea><div class="annotationActions"><button class="saveNote" disabled>保存标记</button><button class="exportNotes">导出修改意见</button></div><p class="saveState" role="status">标记保存在当前浏览器；导出后可发给我继续调整。</p><ol class="annotationList"></ol>';
card.querySelector('.details').before(panel);let selection=null,notes=[];const key='qiaohu-492-annotations-v1';try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))notes=saved.filter(n=>Number.isInteger(n.x)&&Number.isInteger(n.y)&&n.x>=0&&n.y>=0&&n.x<33&&n.y<33&&typeof n.text==='string')}catch{}
const text=panel.querySelector('textarea'),save=panel.querySelector('.saveNote');
function overlay(){draw(canvas,sheet,card.querySelector('.codes').checked,40);const c=canvas.getContext('2d');notes.forEach((n,i)=>{c.strokeStyle='#e02965';c.lineWidth=4;c.strokeRect(n.x*40+2,n.y*40+2,36,36);c.fillStyle='#e02965';c.fillRect(n.x*40,n.y*40,22,20);c.fillStyle='#fff';c.font='bold 14px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText(String(i+1),n.x*40+11,n.y*40+10)});if(selection){c.strokeStyle='#0669ff';c.lineWidth=4;c.strokeRect(selection.x*40+2,selection.y*40+2,36,36)}}
function persist(){try{localStorage.setItem(key,JSON.stringify(notes));panel.querySelector('.saveState').textContent='已保存在当前浏览器。导出修改意见后可发给我继续调整。'}catch{panel.querySelector('.saveState').textContent='浏览器无法保存，请导出修改意见以免丢失。'}}
function list(){const ol=panel.querySelector('ol');ol.replaceChildren();notes.forEach((n,i)=>{const li=document.createElement('li');const content=document.createElement('span');content.textContent='第 '+(n.y+1)+' 行，第 '+(n.x+1)+' 列：'+n.text;const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>select(n.x,n.y);const remove=document.createElement('button');remove.textContent='删除';remove.onclick=()=>{notes.splice(i,1);persist();list();overlay()};li.append(content,edit,remove);ol.append(li)})}
function select(x,y){selection={x,y};text.value=notes.find(n=>n.x===x&&n.y===y)?.text||'';panel.querySelector('.selection').textContent='第 '+(y+1)+' 行 · 第 '+(x+1)+' 列 · '+(sheet.grid[y][x]||'空白格');save.disabled=false;overlay()}
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*sheet.size),y=Math.floor((e.clientY-r.top)/r.height*sheet.size);if(x>=0&&y>=0&&x<sheet.size&&y<sheet.size)select(x,y)});
save.onclick=()=>{if(!selection||!text.value.trim()){panel.querySelector('.saveState').textContent='请先选格并填写修改说明。';return}const note={...selection,text:text.value.trim()},existing=notes.findIndex(n=>n.x===note.x&&n.y===note.y);if(existing<0)notes.push(note);else notes[existing]=note;persist();list();overlay()};
card.querySelector('.codes').addEventListener('change',overlay);card.querySelector('.scale').addEventListener('input',overlay);
panel.querySelector('.exportNotes').onclick=()=>{const data={name:'巧虎与四叶草',version:'A-492',size:33,beadCount:492,coordinateSystem:'行列从 1 开始',annotations:notes.map((n,i)=>({number:i+1,row:n.y+1,column:n.x+1,color:sheet.grid[n.y][n.x],comment:n.text}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='巧虎-A版-修改意见.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};list();overlay();
